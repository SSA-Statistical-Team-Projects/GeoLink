# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, test_master, add_rasterdld]
  pull_request:
name: R-CMD-check.yaml
permissions: read-all
# one run per branch or pull request: a newer push cancels the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    # offline tests only (live-server tests need GEOLINK_LIVE_TESTS=true, see live-tests.yaml)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # pull requests: Ubuntu with R release only; pushes: macOS, Windows and Ubuntu
        # (release), Ubuntu devel and oldrel-1
        config: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","r":"release"}]' || '[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]') }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      USERNAME_NASA: ${{ secrets.USERNAME_NASA }}
      PASSWORD_NASA: ${{ secrets.PASSWORD_NASA }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
     # Set up Python to resolve the python3 dependency
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      # package cache on (setup-r-dependencies default: cache: true)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # no manual, no vignettes; only ERRORs fail the job (pre-existing WARNINGs to be fixed
      # separately, then error-on goes back to '"warning"')
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual","--ignore-vignettes")'
          error-on: '"error"'
