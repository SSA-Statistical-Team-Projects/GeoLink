# The full test suite, including the tests that download from live servers
# (GEOLINK_LIVE_TESTS=true): weekly and on demand. Pull-request checks (R-CMD-check.yaml)
# run the offline tests only.
on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:
name: live-tests.yaml
permissions: read-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-tests:
    runs-on: ubuntu-latest
    name: full test suite, live servers (ubuntu-latest, release)
    timeout-minutes: 360
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      USERNAME_NASA: ${{ secrets.USERNAME_NASA }}
      PASSWORD_NASA: ${{ secrets.PASSWORD_NASA }}
      GEOLINK_LIVE_TESTS: 'true'
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual","--ignore-vignettes")'
          error-on: '"error"'
